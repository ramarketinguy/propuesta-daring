<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ingresar | Daring Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body class="login-page">
  <main class="login-card">
    <div class="brand"><span class="brand-mark">D</span>Daring <span style="color:var(--muted);font-weight:500">Admin</span></div>
    <h1>Ingresar al panel.</h1>
    <p>Usá tus credenciales para ver el estado de la página.</p>
    <form class="login-form" id="login-form">
      <label>Correo electrónico<input name="email" type="email" autocomplete="username" required></label>
      <label>Contraseña
        <span class="password-wrap">
          <input name="password" type="password" autocomplete="current-password" required>
          <button type="button" class="toggle-password" aria-label="Mostrar contraseña" aria-pressed="false">
            <svg class="eye" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="eye-off" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          </button>
        </span>
      </label>
      <button class="button" type="submit">Ingresar</button>
      <p class="message" id="login-message" role="alert" aria-live="polite"></p>
    </form>
  </main>
  <script type="module">
    const form = document.querySelector('#login-form');
    const message = document.querySelector('#login-message');
    const togglePassword = document.querySelector('.toggle-password');
    const passwordInput = form.querySelector('input[name="password"]');
    togglePassword.addEventListener('click', () => {
      const show = passwordInput.type === 'password';
      passwordInput.type = show ? 'text' : 'password';
      togglePassword.setAttribute('aria-pressed', String(show));
      togglePassword.setAttribute('aria-label', show ? 'Ocultar contraseña' : 'Mostrar contraseña');
      togglePassword.classList.toggle('showing', show);
    });
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      message.textContent = '';
      const response = await fetch('/api/auth/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'same-origin', body: JSON.stringify(Object.fromEntries(new FormData(form))) });
      const result = await response.json();
      if (!response.ok) { message.textContent = result.error || 'No se pudo iniciar sesión.'; return; }
      window.location.replace('/admin/');
    });
  </script>
</body>
</html>
